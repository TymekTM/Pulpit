# Release build: tag push (v*) or manual dispatch builds the desktop exe
# on Windows and publishes it with the updater manifest (latest.json).
# AGENTS.md: a distributable pulpit-desktop.exe must come from
# `npx tauri build` run in apps/desktop - this is that command, automated.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The tablet APK rides in the same release and feed: the desktop's
  # "Aktualizuj tablet" downloads it and runs `adb install -r`. That only
  # works when the APK is signed with the key already on the tablet, and
  # the release build signs with the debug keystore - so the owner's
  # ~/.android/debug.keystore goes in the ANDROID_DEBUG_KEYSTORE_B64
  # secret (base64). Without the secret this job builds nothing and the
  # release ships the exe alone; a CI-generated key would be rejected
  # by the tablet (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
  apk:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.flag.outputs.built }}
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - id: flag
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set - the release will not include a tablet APK"
          fi

      - uses: actions/checkout@v4
        if: steps.flag.outputs.built == 'true'

      - uses: actions/setup-java@v4
        if: steps.flag.outputs.built == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.flag.outputs.built == 'true'
        with:
          gradle-version: 8.7
          cache-provider: basic

      - uses: android-actions/setup-android@v4
        if: steps.flag.outputs.built == 'true'
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Restore the signing key
        if: steps.flag.outputs.built == 'true'
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build the release APK
        if: steps.flag.outputs.built == 'true'
        working-directory: apps/mobile
        run: gradle :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: steps.flag.outputs.built == 'true'
        with:
          name: tablet-apk
          path: apps/mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  build:
    needs: apk
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # the single version source (workspace Cargo.toml)
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $line = Get-Content Cargo.toml |
            Where-Object { $_ -match '^version = "(.+)"' } |
            Select-Object -First 1
          if (-not $line) { throw "no workspace version found in Cargo.toml" }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $($env:GITHUB_REF_NAME) does not match the workspace version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build exe
        working-directory: apps/desktop
        run: npx tauri build --no-bundle

      - uses: actions/download-artifact@v4
        if: needs.apk.outputs.built == 'true'
        with:
          name: tablet-apk
          path: apk

      - name: Stage artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Recurse -Filter pulpit-desktop.exe `
            -Path target, apps/desktop/src-tauri/target -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "pulpit-desktop.exe not found after the build" }
          Copy-Item $exe.FullName "dist/pulpit-desktop-$version.exe"
          $hash = (Get-FileHash "dist/pulpit-desktop-$version.exe" -Algorithm SHA256).Hash.ToLower()
          $feed = [ordered]@{
            sha256 = $hash
            version = $version
            url = "https://github.com/${{ github.repository }}/releases/download/v$version/pulpit-desktop-$version.exe"
          }
          # the tablet APK, when the apk job built one (see its comment)
          if ("${{ needs.apk.outputs.built }}" -eq "true") {
            Copy-Item apk/app-release.apk "dist/pulpit-$version.apk"
            $feed.apk_sha256 = (Get-FileHash "dist/pulpit-$version.apk" -Algorithm SHA256).Hash.ToLower()
            $feed.apk_url = "https://github.com/${{ github.repository }}/releases/download/v$version/pulpit-$version.apk"
          }
          $feed | ConvertTo-Json | Set-Content dist/latest.json
          Get-Content dist/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          # Release notes: a checked-in file wins (ship it with the
          # version-bump commit), otherwise GitHub generates them from
          # the commits. Never ship the old placeholder again.
          $notesArgs = @("--generate-notes")
          if (Test-Path ".github/release-notes/v$version.md") {
            $notesArgs = @("--notes-file", ".github/release-notes/v$version.md")
          }
          $releaseArgs = @(
            "release", "create", "v$version",
            "dist/pulpit-desktop-$version.exe", "dist/latest.json",
            "--title", "v$version"
          ) + $notesArgs
          # a tag push already carries the tag; a manual dispatch creates it
          if (Test-Path "dist/pulpit-$version.apk") { $releaseArgs += "dist/pulpit-$version.apk" }
          if ($env:GITHUB_REF_TYPE -eq "tag") { $releaseArgs += "--verify-tag" }
          gh @releaseArgs

      # the updater feed is the manifest on the default branch (raw
      # latest.json) - without this step a published release never
      # reaches installed apps
      - name: Update the feed manifest on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $content = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes((Get-Content dist/latest.json -Raw)))
          $sha = gh api "repos/${{ github.repository }}/contents/latest.json?ref=main" `
            --jq .sha 2>$null
          $shaArgs = @()
          if ($sha) { $shaArgs += @("-f", "sha=$sha") }
          gh api --method PUT "repos/${{ github.repository }}/contents/latest.json" `
            -f message="release: update feed to ${{ steps.ver.outputs.version }}" `
            -f content=$content `
            -f branch=main `
            @shaArgs
