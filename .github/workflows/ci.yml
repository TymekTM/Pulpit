name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds are never rebuilt incrementally, so the incremental cache
  # only costs disk and cache-upload time
  CARGO_INCREMENTAL: 0
  # no debuginfo: much shorter links on Windows and a smaller target/ to
  # cache; backtraces still show function names
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_NET_RETRY: 10

jobs:
  # Decides which expensive jobs a change needs. Skipped jobs count as
  # passed, so the `ci` gate below is the one check to require.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      frontend: ${{ steps.f.outputs.frontend }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      # a pull_request is diffed through the API; only a push needs a clone
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/server/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/desktop/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'crates/proto/**'
              - '.github/workflows/ci.yml'

  # Linux is several times cheaper and quicker than Windows; fmt needs no
  # compiled code at all, so it gives feedback in seconds.
  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # The Rust jobs stay on Windows (crates/os, the Discord pipe and the
  # Tauri shell are Windows code), but clippy and the tests run side by
  # side instead of one after the other.
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Real-time scanning of target/ is a well-known tax on Windows Rust
      # builds (thousands of small files written and re-read per build)
      - name: Disable Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # PR runs restore main's cache but do not save their own: it saves
      # an upload per push and keeps the 10 GB cache quota for main.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Warnings are denied except the lint names that already fire on the
      # current baseline (pulpit-proto, pulpit-aidev, pulpit-ext). Fix the
      # baseline and shrink the allowlist until it is empty.
      - name: Clippy
        run: >-
          cargo clippy --workspace --all-targets --locked -- -D warnings
          -A clippy::empty_line_after_doc_comments
          -A clippy::identity_op
          -A clippy::large_enum_variant
          -A clippy::manual_repeat_n
          -A clippy::match_result_ok
          -A clippy::redundant_closure
          -A clippy::too_many_arguments
          -A clippy::unnecessary_map_or
          -A unreachable_patterns

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Real-time scanning of target/ is a well-known tax on Windows Rust
      # builds (thousands of small files written and re-read per build)
      - name: Disable Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Live device tests (real audio, screen capture, Discord pipe) are
      # #[ignore]d, so the suite is safe on a CI runner.
      - name: Tests
        run: cargo test --workspace --locked

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci

      - name: Build
        run: npx vite build

      - name: Unit tests
        run: npx vitest run

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper is committed; 8.7 is the minimum AGP 8.5 needs.
      # Only main writes the Gradle cache; PRs just read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

  # The single required check: green when every job either passed or was
  # skipped by the path filter, red if any failed or was cancelled.
  ci:
    if: always()
    needs: [changes, fmt, clippy, test, frontend, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            exit 1
          fi
