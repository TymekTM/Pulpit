[workspace]
resolver = "2"
members = ["crates/db", "crates/actions", "crates/proto", "crates/legacy", "crates/ext", "crates/vm", "crates/discord", "crates/sysinfo", "crates/season", "crates/aidev", "crates/os", "crates/v2", "crates/spotify", "crates/obs", "crates/backend", "crates/host", "crates/tools", "crates/i18n", "apps/server", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.9.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# feature trim over "full": rt/macros/net/sync/time/signal is everything
# the workspace uses (spawn_blocking lives behind "rt", ctrl_c/SIGTERM
# behind "signal"); keeps the binary image and its resident pages smaller
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
enigo = "0.2"
open = "5"
rand = "0.8"
futures-util = "0.3"
tokio-tungstenite = "0.24"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"

# smaller image = fewer resident pages; LTO + one CGU deduplicate Boa and
# the stack of async helpers, strip drops symbols nobody loads at runtime.
# opt-level "s" for everything except the JS engine: measured on the Linux
# server at 0da95cd, "s" everywhere shrinks the binary 26% but makes
# extension JavaScript ~50% slower; keeping the engine crates at 3 gives
# 17% with unchanged JS speed (22% together with the trimmed Boa features
# in crates/ext/Cargo.toml). Idle CPU and memory are the same either way.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# the JS engine and its regex engine stay speed-optimized (see above)
[profile.release.package.boa_engine]
opt-level = 3
[profile.release.package.boa_parser]
opt-level = 3
[profile.release.package.boa_ast]
opt-level = 3
[profile.release.package.boa_gc]
opt-level = 3
[profile.release.package.boa_interner]
opt-level = 3
[profile.release.package.boa_string]
opt-level = 3
[profile.release.package.regress]
opt-level = 3
