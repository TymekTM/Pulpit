<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="pair-title pair-desc">
<title id="pair-title">Pairing a tablet with Pulpit</title>
<desc id="pair-desc">Five steps between the PC and the tablet. 1 Advertise: the desktop announces _pulpit._tcp over mDNS and the tablet lists the PC. 2 Request: the tablet posts its name to /v2/pair-request and the PC mints an eight-character code. 3 Compare: the same code shows in the desktop's pairing dialog and on the tablet, and a person checks that they match. 4 Approve: the person clicks Trust on the PC while the tablet polls the request until it is approved. 5 Connect: the tablet opens /v2/ws with the code and says hello; the welcome carries a per-device token, the code is spent, and later connections use the token. Without discovery, a code generated in Settings, Tablets is typed on the tablet instead.</desc>
<style>
text{font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;fill:#ecf0f1}
.m,.ml{font-family:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.ml{font-size:11px;fill:#8b97a1}
.lbl{font-size:11px;font-weight:600;letter-spacing:1.4px;fill:#8b97a1}
.h{font-size:15px;font-weight:600}
.h2{font-size:14px;font-weight:600}
.b{font-size:13.5px;font-weight:600}
.s{font-size:12px;fill:#a3b0b8}
.n{font-size:12px;fill:#8b97a1}
.c{font-size:12.5px;fill:#ecf0f1}
.card{fill:#222a31;stroke:#2f3a44}
</style>
<defs>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1abc9c"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7885"/></marker>
</defs>
<rect x=".5" y=".5" width="1199" height="499" rx="18" fill="#12171b" stroke="#252f38"/>

<text class="lbl" x="32" y="57">STEP</text>
<rect x="24" y="92" width="168" height="112" rx="12" fill="#1abc9c" fill-opacity=".08"/>
<text class="lbl" x="40" y="122" style="fill:#1abc9c">PC</text>
<text class="h2" x="40" y="148">Pulpit desktop</text>
<text class="s" x="40" y="168">editor + server</text>
<rect x="24" y="292" width="168" height="112" rx="12" fill="#ffffff" fill-opacity=".04"/>
<text class="lbl" x="40" y="322">TABLET</text>
<text class="h2" x="40" y="348">Pulpit for Android</text>
<text class="s" x="40" y="368">same local network</text>

<circle cx="225" cy="52" r="12" fill="#1abc9c"/><text x="225" y="56.5" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#0b2a23">1</text><text class="h" x="245" y="57">Advertise</text><rect class="card" x="213" y="92" width="178" height="112" rx="12"/><rect class="card" x="213" y="292" width="178" height="112" rx="12"/><circle cx="421" cy="52" r="12" fill="#1abc9c"/><text x="421" y="56.5" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#0b2a23">2</text><text class="h" x="441" y="57">Request</text><rect class="card" x="409" y="92" width="178" height="112" rx="12"/><rect class="card" x="409" y="292" width="178" height="112" rx="12"/><circle cx="617" cy="52" r="12" fill="#1abc9c"/><text x="617" y="56.5" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#0b2a23">3</text><text class="h" x="637" y="57">Compare</text><rect class="card" x="605" y="92" width="178" height="112" rx="12"/><rect class="card" x="605" y="292" width="178" height="112" rx="12"/><circle cx="813" cy="52" r="12" fill="#1abc9c"/><text x="813" y="56.5" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#0b2a23">4</text><text class="h" x="833" y="57">Approve</text><rect class="card" x="801" y="92" width="178" height="112" rx="12"/><rect class="card" x="801" y="292" width="178" height="112" rx="12"/><circle cx="1009" cy="52" r="12" fill="#1abc9c"/><text x="1009" y="56.5" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#0b2a23">5</text><text class="h" x="1029" y="57">Connect</text><rect class="card" x="997" y="92" width="178" height="112" rx="12"/><rect class="card" x="997" y="292" width="178" height="112" rx="12"/><text class="b" x="229" y="120" >Announce on mDNS</text><text class="m" x="229" y="144" style="font-size:12.5px;fill:#1abc9c">_pulpit._tcp</text><text class="s" x="229" y="166" >while the server runs;</text><text class="s" x="229" y="184" >TXT proto=v2, version</text><text class="b" x="229" y="320" >Find the PC</text><rect x="227" y="334" width="150" height="30" rx="7" fill="#2c353e"/><rect x="237" y="343" width="16" height="12" rx="2" fill="none" stroke="#a3b0b8" stroke-width="1.5"/><text class="c" x="261" y="354" >my-pc</text><path d="M361 344l5 5-5 5" stroke="#a3b0b8" stroke-width="1.6" fill="none"/><text class="s" x="229" y="386" >in the tablet's list of PCs</text><path d="M302 210V284" stroke="#1abc9c" stroke-width="1.6" fill="none" stroke-dasharray="4 5" marker-end="url(#aa)"/><text class="ml" x="311" y="251" text-anchor="start">mDNS</text><text class="b" x="425" y="120" >Mint a code</text><text class="s" x="425" y="142" >8 characters, one request</text><text class="s" x="425" y="160" >at a time</text><rect x="425" y="168" width="146" height="30" rx="7" fill="#13181c" stroke="#252f38"/><text class="m" x="498" y="188" text-anchor="middle" style="font-size:13px;font-weight:700;letter-spacing:2px;fill:#ecf0f1">HV4R7KTW</text><text class="b" x="425" y="320" >Ask to pair</text><text class="m" x="425" y="344" style="font-size:11.5px;fill:#ecf0f1">POST /v2/pair-request</text><text class="m" x="425" y="364" style="font-size:11.5px;fill:#8b97a1">{ "name": …}</text><text class="s" x="425" y="388" >Living-room tablet</text><path d="M461 284V210" stroke="#1abc9c" stroke-width="1.6" fill="none" marker-end="url(#aa)"/><text class="ml" x="452" y="251" text-anchor="end">name</text><path d="M535 210V284" stroke="#1abc9c" stroke-width="1.6" fill="none" marker-end="url(#aa)"/><text class="ml" x="544" y="251" text-anchor="start">code</text><text class="b" x="621" y="120" >Pairing request</text><text class="s" x="621" y="142" >Living-room tablet</text><rect x="621" y="154" width="146" height="30" rx="7" fill="#13181c" stroke="#252f38"/><text class="m" x="694" y="174" text-anchor="middle" style="font-size:15px;font-weight:700;letter-spacing:2px;fill:#ecf0f1">HV4R7KTW</text><text class="s" x="621" y="200" ></text><text class="b" x="621" y="320" >Show the code</text><rect x="621" y="332" width="146" height="30" rx="7" fill="#13181c" stroke="#252f38"/><text class="m" x="694" y="352" text-anchor="middle" style="font-size:15px;font-weight:700;letter-spacing:2px;fill:#ecf0f1">HV4R7KTW</text><text class="s" x="621" y="386" >must match the PC</text><rect x="632" y="233" width="124" height="30" rx="15" fill="#1abc9c" fill-opacity=".14"/><text class="c" x="694" y="253" text-anchor="middle" style="fill:#1abc9c">a person checks</text><text class="b" x="817" y="120" >Click Trust</text><rect x="817" y="138" width="66" height="30" rx="7" fill="#2c353e"/><text class="c" x="850" y="158" text-anchor="middle">Deny</text><rect x="891" y="138" width="72" height="30" rx="7" fill="#1abc9c"/><text class="c" x="927" y="158" text-anchor="middle" style="font-weight:600;fill:#0b2a23">Trust</text><text class="s" x="817" y="190" >the code is pre-approved</text><text class="b" x="817" y="320" >Poll the request</text><text class="m" x="817" y="344" style="font-size:11px;fill:#ecf0f1">GET …/pair-request/:id</text><rect x="817" y="358" width="76" height="24" rx="12" fill="#1abc9c" fill-opacity=".14"/><text class="c" x="855" y="374" text-anchor="middle" style="fill:#1abc9c">approved</text><path d="M890 210V284" stroke="#1abc9c" stroke-width="1.6" fill="none" marker-end="url(#aa)"/><text class="ml" x="899" y="251" text-anchor="start">status</text><text class="b" x="1013" y="120" >Issue a token</text><text class="s" x="1013" y="142" >welcome carries a</text><text class="s" x="1013" y="160" >per-device token;</text><text class="s" x="1013" y="178" >the code is spent</text><text class="b" x="1013" y="320" >Connect</text><text class="m" x="1013" y="344" style="font-size:11.5px;fill:#ecf0f1">/v2/ws?pair=CODE</text><text class="s" x="1013" y="366" >keeps the token; later</text><text class="s" x="1013" y="384" >connects use ?token=</text><path d="M1049 284V210" stroke="#1abc9c" stroke-width="1.6" fill="none" marker-end="url(#aa)"/><text class="ml" x="1040" y="251" text-anchor="end">hello</text><path d="M1123 210V284" stroke="#1abc9c" stroke-width="1.6" fill="none" marker-end="url(#aa)"/><text class="ml" x="1132" y="251" text-anchor="start">token</text>

<path d="M24 434H1176" stroke="#252f38"/>
<text class="n" x="32" y="460"><tspan style="fill:#ecf0f1;font-weight:600">No discovery on your network?</tspan> Settings → Tablets → Generate code (valid once, for 5 minutes), then type it on the tablet;</text>
<text class="n" x="32" y="480">the PC still asks before it trusts the device. Over USB, <tspan class="m">adb reverse</tspan> lets the tablet reach the PC at 127.0.0.1.</text>

</svg>
