<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 724" width="1200" height="724" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Pulpit architecture</title>
<desc id="arch-desc">Two hosts run the same server core: the desktop app (Tauri 2 and Vue 3, with the board editor, touch mode, settings and tray) embeds it, and pulpit-server runs it headless. The core serves two protocols on one port, 8500: the legacy socket.io protocol for the stock Deckboard Android client and Pulpit protocol v2 over WebSocket for the Pulpit Android app, which finds the PC over mDNS and pairs with a code. Inside the core are the command engine, the extension host for Deckboard extensions, the live-state hub fed by system info, media, tools, seasonal themes and AI usage, the Spotify, OBS, Discord and Voicemeeter integrations, and the data folder. Underneath, a platform layer talks to Windows (WASAPI, the media session, the Discord pipe, the Voicemeeter DLL, self-update) or Linux (pactl, MPRIS over busctl, wl-copy or xclip, grim or import, pw-play, paplay or aplay).</desc>
<style>
text{font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;fill:#ecf0f1}
.m{font-family:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:1.4px;fill:#8b97a1}
.h{font-size:16px;font-weight:600}
.h2{font-size:14.5px;font-weight:600}
.s{font-size:12.5px;fill:#a3b0b8}
.n{font-size:12px;fill:#8b97a1}
.c{font-size:12px;fill:#ecf0f1}
.ca{font-size:12px;fill:#1abc9c}
.card{fill:#222a31;stroke:#2f3a44}
.box{fill:#1a2026;stroke:#2f3a44}
.chip{fill:#2c353e}
.chipa{fill:#1abc9c;fill-opacity:.14}
.ln{stroke:#4a5866;stroke-width:1.5;fill:none}
.la{stroke:#1abc9c;stroke-width:1.5;fill:none}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5866"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1abc9c"/></marker>
</defs>
<rect x=".5" y=".5" width="1199" height="723" rx="18" fill="#12171b" stroke="#252f38"/>

<!-- column labels -->
<text class="lbl" x="32" y="230">CLIENTS</text>
<text class="lbl" x="360" y="44">HOSTS</text>

<text class="lbl" x="32" y="44">FLOW</text>
<text class="n" x="32" y="68">A press on a tablet goes to the PC,</text>
<text class="n" x="32" y="86">which runs the action. State changes</text>
<text class="n" x="32" y="104">(volume, now playing, OBS scene...)</text>
<text class="n" x="32" y="122">come back as pushes to every client.</text>
<!-- hosts -->
<rect class="card" x="360" y="60" width="520" height="104" rx="12"/>
<text class="h" x="380" y="90">Desktop app</text>
<text class="s" x="380" y="111">Tauri 2 + Vue 3 · embeds the server</text>
<rect class="chip" x="380" y="124" width="104" height="26" rx="13"/><text class="c" x="432" y="141" text-anchor="middle">Board editor</text>
<rect class="chip" x="492" y="124" width="98" height="26" rx="13"/><text class="c" x="541" y="141" text-anchor="middle">Touch mode</text>
<rect class="chip" x="598" y="124" width="80" height="26" rx="13"/><text class="c" x="638" y="141" text-anchor="middle">Settings</text>
<rect class="chip" x="686" y="124" width="58" height="26" rx="13"/><text class="c" x="715" y="141" text-anchor="middle">Tray</text>

<rect class="card" x="900" y="60" width="268" height="104" rx="12"/>
<text class="h" x="920" y="90">Headless server</text>
<text class="m" x="920" y="112" font-size="13" fill="#1abc9c">pulpit-server</text>
<text class="n" x="920" y="140">Same core, no window</text>

<path class="la" d="M620 164V196" marker-end="url(#aa)"/>
<path class="la" d="M1034 164V196" marker-end="url(#aa)"/>

<!-- server core -->
<rect x="360" y="204" width="808" height="328" rx="14" fill="#171c21" stroke="#1abc9c" stroke-opacity=".55"/>
<text class="lbl" x="380" y="230" fill="#1abc9c" style="fill:#1abc9c">SERVER CORE</text>
<text class="n" x="1148" y="230" text-anchor="end">one port for both protocols: <tspan class="m" fill="#ecf0f1">8500</tspan></text>

<!-- protocols -->
<rect class="box" x="380" y="246" width="240" height="84" rx="10"/>
<text class="h2" x="396" y="272">Legacy protocol</text>
<text class="s" x="396" y="292">Engine.IO v3 + socket.io v2</text>
<text class="m" x="396" y="314" font-size="12" fill="#8b97a1">/socket.io/</text>

<rect class="box" x="380" y="342" width="240" height="84" rx="10"/>
<text class="h2" x="396" y="368">Protocol v2</text>
<text class="s" x="396" y="388">WebSocket, typed JSON, deltas</text>
<text class="m" x="396" y="410" font-size="12" fill="#8b97a1">/v2/ws</text>

<rect class="box" x="380" y="438" width="240" height="78" rx="10"/>
<text class="h2" x="396" y="464">Pairing</text>
<text class="s" x="396" y="484">codes, per-device tokens</text>
<text class="m" x="396" y="504" font-size="12" fill="#8b97a1">mDNS _pulpit._tcp</text>

<!-- engine -->
<rect class="box" x="640" y="246" width="248" height="84" rx="10"/>
<text class="h2" x="656" y="272">Command engine</text>
<text class="s" x="656" y="292">keys, audio, apps, URLs,</text>
<text class="s" x="656" y="310">HTTP requests, multi-actions</text>

<rect class="box" x="900" y="246" width="248" height="84" rx="10"/>
<text class="h2" x="916" y="272">Extension host</text>
<text class="s" x="916" y="292">Deckboard .asar extensions</text>
<text class="s" x="916" y="310">on an embedded JS engine</text>

<rect class="box" x="640" y="342" width="508" height="84" rx="10"/>
<text class="h2" x="656" y="368">Live state</text>
<text class="s" x="1132" y="368" text-anchor="end">pushed to every client</text>
<rect class="chip" x="656" y="384" width="90" height="26" rx="13"/><text class="c" x="701" y="401" text-anchor="middle">System info</text>
<rect class="chip" x="754" y="384" width="62" height="26" rx="13"/><text class="c" x="785" y="401" text-anchor="middle">Media</text>
<rect class="chip" x="824" y="384" width="56" height="26" rx="13"/><text class="c" x="852" y="401" text-anchor="middle">Tools</text>
<rect class="chip" x="888" y="384" width="118" height="26" rx="13"/><text class="c" x="947" y="401" text-anchor="middle">Seasonal themes</text>
<rect class="chip" x="1014" y="384" width="80" height="26" rx="13"/><text class="c" x="1054" y="401" text-anchor="middle">AI usage</text>

<rect class="box" x="640" y="438" width="320" height="78" rx="10"/>
<text class="h2" x="656" y="464">Integrations</text>
<rect class="chip" x="656" y="476" width="66" height="26" rx="13"/><text class="c" x="689" y="493" text-anchor="middle">Spotify</text>
<rect class="chip" x="730" y="476" width="50" height="26" rx="13"/><text class="c" x="755" y="493" text-anchor="middle">OBS</text>
<rect class="chip" x="788" y="476" width="66" height="26" rx="13"/><text class="c" x="821" y="493" text-anchor="middle">Discord</text>
<rect class="chip" x="862" y="476" width="88" height="26" rx="13"/><text class="c" x="906" y="493" text-anchor="middle">Voicemeeter</text>

<rect class="box" x="972" y="438" width="176" height="78" rx="10"/>
<text class="h2" x="988" y="464">Data folder</text>
<text class="m" x="988" y="485" font-size="12" fill="#1abc9c">~/pulpitApp</text>
<text class="n" x="988" y="504">SQLite + JSON files</text>

<!-- clients -->
<rect class="card" x="32" y="246" width="268" height="84" rx="12"/>
<text class="h2" x="50" y="272">Stock Deckboard client</text>
<text class="s" x="50" y="292">Android, Free and Pro</text>
<text class="n" x="50" y="312">connects by QR, no pairing</text>

<rect class="card" x="32" y="342" width="268" height="84" rx="12"/>
<rect x="32" y="342" width="4" height="84" rx="2" fill="#1abc9c"/>
<text class="h2" x="50" y="368">Pulpit for Android</text>
<text class="s" x="50" y="388">native Kotlin / Compose</text>
<text class="n" x="50" y="408">offline board cache, gestures</text>

<rect class="card" x="32" y="438" width="268" height="78" rx="12"/>
<text class="h2" x="50" y="464">Network</text>
<text class="s" x="50" y="484">same local network, or USB</text>
<text class="s" x="50" y="502">through <tspan class="m" font-size="12">adb reverse</tspan></text>

<path class="ln" d="M300 288H372" marker-end="url(#ar)"/>
<path class="la" d="M300 384H372" marker-end="url(#aa)"/>
<path class="la" d="M316 384V477H372" stroke-dasharray="4 4" marker-end="url(#aa)"/>
<text class="n" x="336" y="270" text-anchor="middle">legacy</text>
<text class="ca" x="336" y="372" text-anchor="middle">v2</text>

<!-- platform layer -->
<text class="lbl" x="360" y="566">PLATFORM LAYER</text>
<text class="n" x="1168" y="566" text-anchor="end">chosen at build time</text>
<path class="ln" d="M764 532V572" marker-end="url(#ar)"/>
<path class="ln" d="M968 532V572" marker-end="url(#ar)"/>

<rect class="card" x="360" y="580" width="398" height="112" rx="12"/>
<text class="h" x="380" y="608">Windows 10 / 11</text>
<rect class="chip" x="380" y="622" width="110" height="26" rx="13"/><text class="c" x="435" y="639" text-anchor="middle">WASAPI audio</text>
<rect class="chip" x="498" y="622" width="112" height="26" rx="13"/><text class="c" x="554" y="639" text-anchor="middle">Media session</text>
<rect class="chip" x="618" y="622" width="130" height="26" rx="13"/><text class="c" x="683" y="639" text-anchor="middle">Clipboard, capture</text>
<rect class="chip" x="380" y="654" width="128" height="26" rx="13"/><text class="c" x="444" y="671" text-anchor="middle">Discord RPC pipe</text>
<rect class="chip" x="516" y="654" width="130" height="26" rx="13"/><text class="c" x="581" y="671" text-anchor="middle">Voicemeeter DLL</text>

<rect class="card" x="770" y="580" width="398" height="112" rx="12"/>
<text class="h" x="790" y="608">Linux</text>
<text class="n" x="1148" y="608" text-anchor="end">a missing tool turns its feature off</text>
<rect class="chip" x="790" y="622" width="64" height="26" rx="13"/><text class="c m" x="822" y="639" text-anchor="middle">pactl</text>
<rect class="chip" x="862" y="622" width="136" height="26" rx="13"/><text class="c" x="930" y="639" text-anchor="middle">MPRIS via busctl</text>
<rect class="chip" x="1006" y="622" width="142" height="26" rx="13"/><text class="c m" x="1077" y="639" text-anchor="middle">wl-copy / xclip</text>
<rect class="chip" x="790" y="654" width="128" height="26" rx="13"/><text class="c m" x="854" y="671" text-anchor="middle">grim / import</text>
<rect class="chip" x="926" y="654" width="222" height="26" rx="13"/><text class="c m" x="1037" y="671" text-anchor="middle">pw-play / paplay / aplay</text>

<text class="lbl" x="32" y="566">WINDOWS ONLY</text>
<text class="n" x="32" y="590">Discord and Voicemeeter integrations,</text>
<text class="n" x="32" y="608">the self-updater. Everything else</text>
<text class="n" x="32" y="626">runs on Windows and Linux.</text>
</svg>
