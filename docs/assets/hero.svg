<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Pulpit: one board in the desktop editor and on a tablet</title>
<desc id="hero-desc">Illustration. Left, the Pulpit desktop editor: a dark sidebar with the board list and the server status, a top bar with the board name, zoom and the Touch mode button, and a six by four board with scene, microphone, go-live, record, screenshot, chat, media and mute buttons, a volume slider and a clock. Right, a tablet showing the same board, connected over the local network on port 8500.</desc>
